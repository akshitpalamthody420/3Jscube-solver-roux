<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rubik's Cube Solver</title>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        height: 100vh;
        font-family: Arial, sans-serif;
        background: #111;
      }

      #top-bar {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        padding: 10px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 10px;
        display: flex;
        gap: 8px;
      }

      #top-bar button {
        padding: 8px 14px;
        font-size: 15px;
        cursor: pointer;
        border: 1px solid #333;
        border-radius: 6px;
        background: white;
      }

      #manualEntryPanel {
        position: absolute;
        top: 70px;
        left: 15px;
        width: 365px;
        max-height: calc(100vh - 140px);
        overflow-y: auto;
        padding: 14px;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 12px;
        z-index: 15;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
      }

      #manualEntryPanel h2 {
        margin: 0 0 8px;
        font-size: 20px;
      }

      #manualEntryPanel p {
        margin: 8px 0;
        font-size: 14px;
      }

      #colourPalette {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 10px 0;
      }

      .colourBtn {
        padding: 6px 9px;
        border: 1px solid #333;
        border-radius: 5px;
        cursor: pointer;
        font-size: 13px;
      }

      #manualCubeGrid {
        display: grid;
        grid-template-columns: repeat(4, 78px);
        grid-template-rows: repeat(3, auto);
        gap: 6px;
        margin-top: 10px;
      }

      .manualFace {
        display: grid;
        grid-template-columns: repeat(3, 22px);
        grid-template-rows: 15px repeat(3, 22px);
        gap: 2px;
        padding: 4px;
        border: 1px solid #333;
        background: #ddd;
        border-radius: 5px;
      }

      .manualFaceTitle {
        grid-column: span 3;
        font-size: 11px;
        text-align: center;
        font-weight: bold;
      }

      .manualSticker {
        width: 22px;
        height: 22px;
        border: 1px solid #222;
        cursor: pointer;
        box-sizing: border-box;
      }

      .manualSpacer {
        width: 78px;
        height: 78px;
      }

      #saveManualCubeBtn,
      #resetManualCubeBtn {
        margin-top: 10px;
        padding: 7px 10px;
        cursor: pointer;
        border: 1px solid #333;
        border-radius: 6px;
        background: white;
      }

      #manualCubeMessage {
        font-weight: bold;
        color: #222;
      }

      #cube-container {
        width: 100vw;
        height: 100vh;
      }

      #controls {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        padding: 10px;
        text-align: center;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 10px;
      }

      #controls button {
        margin: 3px;
        padding: 6px 10px;
        font-size: 14px;
        cursor: pointer;
        border: 1px solid #333;
        border-radius: 6px;
        background: white;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
          "jsm/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
        }
      }
    </script>
  </head>

  <body>
    <div id="top-bar">
      <button id="scanBtn">Scan Your Cube</button>
      <button id="solveBtn">Solve Your Cube</button>
    </div>

    <div id="manualEntryPanel">
      <h2>Manual Cube Entry</h2>

      <p>Select a colour, then click stickers to fill the cube.</p>

      <div id="colourPalette">
        <button class="colourBtn" data-colour="W" style="background:white;">White</button>
        <button class="colourBtn" data-colour="R" style="background:red; color:white;">Red</button>
        <button class="colourBtn" data-colour="G" style="background:green; color:white;">Green</button>
        <button class="colourBtn" data-colour="Y" style="background:yellow;">Yellow</button>
        <button class="colourBtn" data-colour="O" style="background:orange;">Orange</button>
        <button class="colourBtn" data-colour="B" style="background:blue; color:white;">Blue</button>
      </div>

      <p>Selected colour: <strong id="selectedColourText">White</strong></p>

      <div id="manualCubeGrid"></div>

      <button id="saveManualCubeBtn">Use Manual Cube</button>
      <button id="resetManualCubeBtn">Reset Manual Cube</button>

      <p id="manualCubeMessage"></p>
    </div>

    <div id="cube-container"></div>

    <div id="controls">
      <button id="Lcw">L ⟳</button>
      <button id="Lccw">L ⟲</button>
      <button id="Rcw">R ⟳</button>
      <button id="Rccw">R ⟲</button>
      <button id="Ucw">U ⟳</button>
      <button id="Uccw">U ⟲</button>
      <button id="Dcw">D ⟳</button>
      <button id="Dccw">D ⟲</button>
      <button id="Fcw">F ⟳</button>
      <button id="Fccw">F ⟲</button>
      <button id="Bcw">B ⟳</button>
      <button id="Bccw">B ⟲</button>
    </div>

    <script type="module" src="{{ url_for('static', filename='realcube.js') }}"></script>
  </body>
</html>
